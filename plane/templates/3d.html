<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>3D-ADSB</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='plane-icon.png') }}">

    
<style>
html,body{margin:0;overflow:hidden;background:#000}
#c{width:100vw;height:100vh}
#info{
  position:absolute;top:10px;left:10px;
  color:white;background:rgba(0,0,0,.7);
  padding:10px;border-radius:6px;
  font-family:monospace;
  z-index:10;
}
</style>
</head>
<body>
<div id="c"></div>
<div id="info">
  Beta......<br>
  version 0.1.2<br>
  UNDER DEVELOPMENT
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js"></script>

<script>

const CENTER_LAT    = 27.6923;
const CENTER_LON    = 85.35732;
const ZOOM          = 11;
const GRID_RADIUS   = 6;
const TILE_SIZE     = 19109;
const TERRAIN_SCALE = 1.0;
const UPDATE_INTERVAL_MS = 3000; // 3 seconds


const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000814);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 10, 800000);
camera.position.set(0, 60000, 80000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.getElementById("c").appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enablePan = true;
controls.enableZoom = true;
controls.target.set(0, 0, 0);
controls.minDistance = 500;
controls.maxDistance = 300000;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xfff8e8, 1.2);
sun.position.set(80000, 120000, 60000);
scene.add(sun);


const R = 6378137;

function latLonToTile(lat, lon, z) {
  const n = 2 ** z;
  return {
    x: Math.floor((lon + 180) / 360 * n),
    y: Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n)
  };
}

function decode(r, g, b) {
  return r * 256 + g + b / 256 - 32768;
}

function geoToWorld(lat, lon, altFeet) {
  const lat0  = CENTER_LAT * Math.PI / 180;
  const lon0  = CENTER_LON * Math.PI / 180;
  const latR  = lat * Math.PI / 180;
  const lonR  = lon * Math.PI / 180;
  const dLat  = latR - lat0;
  const dLon  = lonR - lon0;
  const east  = dLon * Math.cos(lat0) * R;
  const north = dLat * R;
  const altM  = altFeet * 0.3048;
  return new THREE.Vector3(east, altM, -north);
}


const terrain = new THREE.Group();
scene.add(terrain);

const centerTile = latLonToTile(CENTER_LAT, CENTER_LON, ZOOM);

for (let dx = -GRID_RADIUS; dx <= GRID_RADIUS; dx++) {
  for (let dy = -GRID_RADIUS; dy <= GRID_RADIUS; dy++) {
    const tx = centerTile.x + dx;
    const ty = centerTile.y + dy;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${ZOOM}/${tx}/${ty}.png`;

    img.onload = () => {
      const size = 64;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      const geo = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE, size-1, size-1);
      const pos = geo.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const x = (i % size) * 4;
        const y = Math.floor(i / size) * size * 4;
        const h = decode(data[x + y], data[x + y + 1], data[x + y + 2]);
        pos.setZ(i, h * TERRAIN_SCALE);
      }
      geo.computeVertexNormals();

      new THREE.TextureLoader().load(
        `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${ZOOM}/${ty}/${tx}`,
        tex => {
          const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex }));
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.set(dx * TILE_SIZE, 0, dy * TILE_SIZE);
          terrain.add(mesh);
        }
      );
    };
  }
}


let planeModel;
const draco = new THREE.DRACOLoader();
draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.128/examples/js/libs/draco/");

const loader = new THREE.GLTFLoader();
loader.setDRACOLoader(draco);
loader.load(
  "/static/plane.glb",  // change to real path / URL if needed
  gltf => {
    planeModel = gltf.scene;
    planeModel.scale.set(1,1,1);
    planeModel.rotation.y = Math.PI;
    planeModel.visible = false;
    scene.add(planeModel);
    console.log("Aircraft model loaded → starting updates");
    startLiveUpdates();  // ← important: start after model is ready
  },
  xhr => console.log(`Model load: ${(xhr.loaded/xhr.total*100).toFixed(1)}%`),
  err => console.error("GLTF error", err)
);


let currentPlanes = [];   
let currentTrails = [];  

function clearOldObjects() {

  currentPlanes.forEach(plane => {
    scene.remove(plane);
    plane.geometry?.dispose();
    plane.material?.dispose();
  });
  currentPlanes = [];


  currentTrails.forEach(trail => {
    scene.remove(trail);
    trail.geometry?.dispose();
    trail.material?.dispose();
  });
  currentTrails = [];
}

function placePlaneInstance(lat, lon, altFeet, heading = 0) {
  if (!planeModel) return null;
  const clone = planeModel.clone(true);
  const pos = geoToWorld(lat, lon, altFeet);
  clone.position.copy(pos);
  clone.rotation.x = THREE.MathUtils.degToRad(90);
  clone.rotation.y = THREE.MathUtils.degToRad(180);
  clone.rotation.z = THREE.MathUtils.degToRad(heading || 0);
  clone.visible = true;
  scene.add(clone);
  return clone;
}

function updateVisualization() {
  fetch('https://plane.kushal-kc.com.np/api/aircraft')
    .then(res => {
      if (!res.ok) throw new Error("plane.json not found or network error");
      return res.json();
    })
    .then(data => {
      clearOldObjects(); 

      const aircraft = Object.values(data.aircraft || {});

      aircraft.forEach(p => {
        const callsign = p.callsign || "???";
        const lat  = p.latitude;
        const lon  = p.longitude;
        const alt  = Number(String(p.altitude || "0").replace(/[^0-9]/g, '')) || 0;
        const heading = p.track ?? 0;


        if (lat && lon && alt > 10) {
          const plane = placePlaneInstance(lat, lon, alt, heading);
          if (plane) {
            currentPlanes.push(plane);
          }
        }


        if (p.positions && p.positions.length >= 2) {
          const points = p.positions.map(pt => {
            const altFt = Number(String(pt.alt || alt).replace(/[^0-9]/g, '')) || alt;
            return geoToWorld(Number(pt.lat), Number(pt.lon), altFt);
          });

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xFF7205,
            linewidth: 5,
            transparent: true,
            opacity: 0.80
          });

          const trail = new THREE.Line(geometry, material);
          trail.frustumCulled = false;
          scene.add(trail);
          currentTrails.push(trail);
        }
      });

      console.log(`Updated: ${currentPlanes.length} planes  |  ${currentTrails.length} trails`);
    })
    .catch(err => {
      console.error("Update failed:", err);
    });
}

function startLiveUpdates() {
  updateVisualization();                   
  setInterval(updateVisualization, UPDATE_INTERVAL_MS); 
}


function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
